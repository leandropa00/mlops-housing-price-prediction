name: pruebas-mlops
on: [push, pull_request]
jobs:
  tests-and-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test,tracking]'
      - name: Registrar tres experimentos en MLflow
        run: python -m housing_mlops.training
      - name: Ejecutar pruebas
        run: pytest -q
      - name: Conservar evidencias de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-mlops
          path: |
            artifacts/experiments.csv
            artifacts/experiments.json
            mlruns/
